
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Kerala Boats</title>
    <link rel="stylesheet" href="/static/css/register.css">
</head>
<body>

<img src="/static/images/login-bg.jpg" class="background-image" alt="Kerala Backwaters">

<div class="background-overlay"></div>

<div class="page-container">

    <div class="welcome-section">
        <a href="/" class="brand">Kerala Boats.</a>
        <div class="welcome-content">
            <span class="welcome-tag">EXPERIENCE KERALA</span>
        </div>
    </div>

    <div class="form-section">
        <div class="form-card">

            <a href="/" class="logo">Kerala Boats.</a>

            <h2>Create Account</h2>
            <p class="form-description">Join us and start your journey</p>

            {% if error %}
                <div class="alert error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/register">

                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name"
                       value="{{ name or '' }}" required>

                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email"
                       value="{{ email or '' }}" required>

                <label>Phone (WhatsApp Number)</label>
                <input type="text" name="phone"
                       placeholder="Enter your phone number"
                       value="{{ phone or '' }}">

                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm"
                       placeholder="Confirm your password" required>

                <button type="submit" class="btn">Create Account</button>

            </form>

            <p class="form-note">
                Already have an account?
                <a href="/login">Login</a>
            </p>

            <a href="/" class="back-link">← Back to Home</a>

        </div>
    </div>

</div>

</body>
</html>
